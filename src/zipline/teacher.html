<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zip Line Thoát Hồ Ly – Màn hình giáo viên</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="banner" class="banner hidden"></div>
  <div class="teacher">

    <!-- 1. Tạo phòng -->
    <section id="setup" class="card hidden">
      <h2>🧑‍🏫 Tạo phòng chơi</h2>
      <form id="setupForm" autocomplete="off">
        <div class="settings-grid">
          <label>Số màn <input id="sLevels" type="number" min="1" max="20" step="1"></label>
          <label>Thời gian (phút) <input id="sTime" type="number" min="1" max="60" step="1"></label>
          <label>Số mạng <input id="sLives" type="number" min="1" max="5" step="1"></label>
          <label style="align-content:end"><span><input id="sEndFirst" type="checkbox"> Kết thúc ván khi có người đầu tiên về đích</span></label>
        </div>
        <details>
          <summary>Tham số hồ ly (chỉnh sau khi thử lớp)</summary>
          <div class="settings-grid">
            <label>Tốc độ tiến (m/giây) <input id="mSpeed" type="number" min="0" step="0.1"></label>
            <label>Quãng nhảy khi sai (m) <input id="mJump" type="number" min="0" step="1"></label>
            <label>Quãng lùi khi hồi sinh (m) <input id="mPush" type="number" min="1" step="1"></label>
            <label>Khoảng cách xuất phát (m) <input id="mStart" type="number" min="1" step="1"></label>
            <label>Bỏ xa khi đúng câu a (m) <input id="mGainA" type="number" min="0" step="1"></label>
            <label>Bỏ xa khi qua màn (m) <input id="mGainLv" type="number" min="0" step="1"></label>
          </div>
        </details>
        <p><button class="btn primary big" type="submit">Tạo phòng</button></p>
        <div class="error" id="setupErr"></div>
      </form>
    </section>

    <!-- 2. Phòng chờ / đang chơi / tổng kết -->
    <section id="roomView" class="hidden">
      <div class="top">
        <div>
          <div class="muted">Mã phòng</div>
          <div class="room-code" id="roomCode">----</div>
          <div class="muted small" id="joinHint"></div>
        </div>
        <div style="text-align:right">
          <div class="muted" id="statusText">Đang chờ</div>
          <div class="big-timer" id="bigTimer">--:--</div>
          <div class="actions" style="justify-content:flex-end">
            <button class="btn primary big" id="btnStart">▶ Bắt đầu</button>
            <button class="btn" id="btnEnd">⏹ Kết thúc sớm</button>
            <button class="btn" id="btnNew">＋ Ván mới</button>
          </div>
        </div>
      </div>

      <div class="card" id="lobbyCard">
        <h3>Đã vào phòng: <span id="lobbyCount">0</span></h3>
        <div class="lobby-names" id="lobbyNames"></div>
      </div>

      <div class="card hidden" id="liveCard">
        <div id="podium" class="podium hidden"></div>
        <table class="live">
          <thead><tr><th>Hạng</th><th>Tên</th><th>Tiến độ</th><th>Mạng</th><th>Hồ ly</th><th>Đúng/Sai</th></tr></thead>
          <tbody id="liveBody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script type="module" src="js/teacher.js"></script>
</body>
</html>
